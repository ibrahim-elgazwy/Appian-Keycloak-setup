# nginx site for the AQARAT portal (production build) on https://portal.aqarat.lab:4200
server {
  # HTTP/1.1 only: on OpenShift all *.aqarat.lab names share one IP and one certificate, and the router picks the pod
  # by SNI (passthrough). With HTTP/2, browsers reuse this connection for keycloak./nas.aqarat.lab and get the portal.
  listen 4200 ssl;
  server_name portal.aqarat.lab;

  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  root /usr/share/nginx/html;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # No frame-ancestors / X-Frame-Options DENY on purpose: the portal is the top-level page that embeds Appian.

  # SPA fallback: deep links such as /callback and /services/renewal are handled by the Angular router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always fetch a fresh index.html so a new build is picked up; hashed bundles can be cached for long.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  # Runtime settings (mounted from a ConfigMap on OpenShift); never cached, 404 when absent.
  location = /config.json {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
