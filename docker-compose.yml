# AQARAT POC — local stack: Keycloak (+ Postgres), a mock NAS (second Keycloak) and a mock AQARAT backend API (no API gateway).
# Hostnames resolve via the hosts file (see README.md). Secrets come from .env (never committed).
name: aqarat-poc

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Issuer = https://keycloak.aqarat.lab:8443/realms/<realm>; must be identical for browser, Appian and the backend API.
      KC_HOSTNAME: https://keycloak.aqarat.lab:8443
      KC_HTTPS_PORT: "8443"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      # Lets Keycloak call the mock NAS (and later the real NAS / Intra-ID) over TLS.
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/certs/ca.crt
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      # Placeholders resolved inside keycloak/realms/*.json at import time.
      NAS_CLIENT_SECRET: ${NAS_CLIENT_SECRET:?set in .env}
      DEV_TESTER_PASSWORD: ${DEV_TESTER_PASSWORD:?set in .env}
      # Public URLs placed into the realm files at import (OpenShift sets the port-less ones).
      AQ_PORTAL_URL: https://portal.aqarat.lab:4200
      AQ_NAS_URL: https://nas.aqarat.lab:8445
    ports:
      - "8443:8443"
    volumes:
      - ./certs/tls.crt:/opt/keycloak/conf/certs/tls.crt:ro
      - ./certs/tls.key:/opt/keycloak/conf/certs/tls.key:ro
      - ./certs/ca.crt:/opt/keycloak/conf/certs/ca.crt:ro
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases:
          - keycloak.aqarat.lab
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8443'"]
      interval: 10s
      retries: 30
      start_period: 30s

  # Mock NAS: a second, separate Keycloak on its own host, acting as the NAS OIDC provider (realm `nas`,
  # client `aqarat-sso`, test personas). LAB ONLY - replaced by the real NAS; see .claude/docs/06.
  mock-nas:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: dev-file                     # throw-away embedded DB inside the container; recreate = fresh import
      KC_HOSTNAME: https://nas.aqarat.lab:8445
      KC_HTTPS_PORT: "8445"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      # Placeholders resolved inside keycloak/realms-nas/nas.json at import time.
      NAS_CLIENT_SECRET: ${NAS_CLIENT_SECRET:?set in .env}
      MOCK_USER_PASSWORD: ${MOCK_USER_PASSWORD:?set in .env}
      AQ_KEYCLOAK_URL: https://keycloak.aqarat.lab:8443
    ports:
      - "8445:8445"
    volumes:
      - ./certs/tls.crt:/opt/keycloak/conf/certs/tls.crt:ro
      - ./certs/tls.key:/opt/keycloak/conf/certs/tls.key:ro
      - ./keycloak/realms-nas:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases:
          - nas.aqarat.lab
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8445'"]
      interval: 10s
      retries: 30
      start_period: 30s

  # Mock AQARAT backend API: the resource server that validates Keycloak tokens itself (no gateway in front).
  mock-api:
    build: ./mock-api
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PORT: "8444"
      OIDC_ISSUER: https://keycloak.aqarat.lab:8443/realms/aqarat-poc
      API_AUDIENCE: aqarat-api
      ALLOWED_ORIGIN: https://portal.aqarat.lab:4200
      RATE_LIMIT_PER_MIN: "100"
      # The backend's own Appian Web API key (production: from Key Vault, never sent to the browser).
      APPIAN_API_KEY: ${APPIAN_API_KEY:-mock-appian-api-key}
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    ports:
      - "8444:8444"
    volumes:
      - ./certs/tls.crt:/certs/tls.crt:ro
      - ./certs/tls.key:/certs/tls.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

volumes:
  pgdata:
