# Keycloak's database. sclorg PostgreSQL runs under OpenShift's random user ID (the Docker Hub image needs root).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sso-postgres-data
  labels: {app.kubernetes.io/part-of: aqarat-sso, app.kubernetes.io/name: sso-postgres}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-postgres
  labels: {app.kubernetes.io/part-of: aqarat-sso, app.kubernetes.io/name: sso-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}          # one writer on the volume at a time
  selector:
    matchLabels: {app.kubernetes.io/name: sso-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: aqarat-sso, app.kubernetes.io/name: sso-postgres}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:20261007
          env:
            - {name: POSTGRESQL_DATABASE, value: keycloak}
            - {name: POSTGRESQL_USER, value: keycloak}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: aqarat-sso-env, key: KC_DB_PASSWORD}}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
          readinessProbe:
            exec: {command: [/usr/libexec/check-container]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5432}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sso-postgres-data}
