# Mock NAS: a second Keycloak acting as the NAS OIDC provider (realm nas). LAB ONLY - replaced by the real NAS.
# Embedded dev-file database: every new pod is a fresh import of nas.json, as with docker compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-mock-nas
  labels: {app.kubernetes.io/part-of: aqarat-sso, app.kubernetes.io/name: sso-mock-nas}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: sso-mock-nas}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: aqarat-sso, app.kubernetes.io/name: sso-mock-nas}
      # Checksum of nas.json (03-deploy.sh): a changed realm file restarts the pod, which re-imports it.
      annotations: {aqarat.qa/nas-realm-sha256: "__NAS_REALM_SHA__"}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: [start, --import-realm]
          env:
            - {name: KC_DB, value: dev-file}
            - {name: KC_HOSTNAME, value: "https://nas.aqarat.lab"}
            - {name: KC_HTTPS_PORT, value: "8445"}
            - {name: KC_HTTP_ENABLED, value: "false"}
            - {name: KC_HTTPS_CERTIFICATE_FILE, value: /opt/keycloak/conf/certs/tls.crt}
            - {name: KC_HTTPS_CERTIFICATE_KEY_FILE, value: /opt/keycloak/conf/certs/tls.key}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            # HTTP/1.1 only: shared IP + certificate + SNI routing; HTTP/2 connection reuse would reach the wrong pod.
            - {name: QUARKUS_HTTP_HTTP2, value: "false"}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: aqarat-sso-env, key: KC_ADMIN_USERNAME}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aqarat-sso-env, key: KC_ADMIN_PASSWORD}}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms128m -Xmx512m"}
            - name: NAS_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: aqarat-sso-env, key: NAS_CLIENT_SECRET}}
            - name: MOCK_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: aqarat-sso-env, key: MOCK_USER_PASSWORD}}
            - {name: AQ_KEYCLOAK_URL, value: "https://keycloak.aqarat.lab"}
          ports:
            - {name: https, containerPort: 8445}
            - {name: management, containerPort: 9000}
          volumeMounts:
            - {name: tls, mountPath: /opt/keycloak/conf/certs, readOnly: true}
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          startupProbe:
            httpGet: {path: /health/started, port: 9000, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000, scheme: HTTPS}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: tls
          secret: {secretName: aqarat-tls, defaultMode: 0440}
        - name: realm
          configMap: {name: sso-realm-nas}
